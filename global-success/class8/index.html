<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class 8 | Global Success</title>
<style>
:root{--navy:#0B1F4D;--red:#D71920;--bg:#F5F6F8;--text:#111}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:3px solid var(--red);padding:18px 20px}
.brand{text-align:center}.brand img{width:min(560px,82vw);height:auto}
main{max-width:1000px;margin:30px auto;padding:0 20px 60px}
.hero,.card{background:#fff;border-radius:18px;padding:26px;box-shadow:0 8px 24px rgba(0,0,0,.06);border-top:4px solid var(--navy);margin-bottom:22px}
h1,h2{color:var(--navy)}
.button{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:700}
.button:hover{background:var(--red)}
.back{display:inline-block;margin-bottom:16px;color:var(--navy);font-weight:700;text-decoration:none}
.unit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.unit-btn{display:block;text-align:center;background:#fff;border:2px solid var(--navy);color:var(--navy);padding:16px;border-radius:12px;font-weight:800;text-decoration:none}
.disabled{border-color:#bbb;color:#777;background:#f1f3f6}
.coming{font-size:13px;font-style:italic;margin-top:4px}
@media(max-width:700px){.unit-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="brand"><img src="../../images/logo_banner.png" alt="Anh ngữ Ms. Kim"></div></header>
<main>
<a class="back" href="../">← Back to Global Success</a>
<section class="hero">
<h1>Class 8</h1>
<p>Choose a skill below.</p>
</section>
<section class="card">
<h2>Writing</h2>
<p>Sentence-building and writing practice.</p>
<a class="button" href="writing/">Writing</a>
</section>
</main>
</body>
</html>
