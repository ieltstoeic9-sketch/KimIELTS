<style>
:root{--navy:#0B1F4D;--red:#D71920;--bg:#F5F6F8;--text:#111}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:3px solid var(--red);padding:18px 20px}
.brand{text-align:center}.brand img{width:min(560px,82vw);height:auto}

.back{display:inline-block;margin-bottom:16px;color:var(--navy);font-weight:700;text-decoration:none}
.unit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.unit-btn{display:block;text-align:center;background:#fff;border:2px solid var(--navy);color:var(--navy);padding:16px;border-radius:12px;font-weight:800;text-decoration:none}
.unit-btn:hover{background:var(--navy);color:#fff}
.disabled{border-color:#bbb;color:#777;background:#f1f3f6}
.disabled:hover{background:#f1f3f6;color:#777}
.coming{font-size:13px;font-style:italic;margin-top:4px}
@media(max-width:700px){.unit-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
