<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class 12 | Global Success</title><style>
:root{--navy:#0B1F4D;--navy2:#173A7A;--red:#D71920;--bg:#F5F6F8;--card:#fff;--text:#111;--muted:#666;--line:#D9DEE8;--blue:#EEF4FF;--redlight:#FFF0F1}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{background:#fff;border-bottom:3px solid var(--red);padding:18px 20px}
.brand{max-width:1100px;margin:auto;display:flex;justify-content:center}
.brand img{width:min(560px,82vw);height:auto}
main{max-width:1100px;margin:30px auto;padding:0 20px 60px}
.hero,.card{background:#fff;border-radius:18px;padding:26px;box-shadow:0 8px 24px rgba(0,0,0,.06);border-top:4px solid var(--navy);margin-bottom:22px}
h1,h2,h3{color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.tile{background:#fff;border-radius:16px;padding:22px;box-shadow:0 7px 20px rgba(0,0,0,.05);border-top:4px solid var(--navy)}
.button{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:700}
.button:hover{background:var(--red)}
.back{display:inline-block;margin-bottom:16px;color:var(--navy);font-weight:700;text-decoration:none}
.unit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.unit-btn{display:block;text-align:center;background:#fff;border:2px solid var(--navy);color:var(--navy);padding:16px;border-radius:12px;font-weight:800;text-decoration:none}
.unit-btn:hover{background:var(--navy);color:#fff}
.unit-btn.disabled{border-color:#b8bec9;color:#7b8190;background:#f1f3f6;cursor:default}
.unit-btn.disabled:hover{background:#f1f3f6;color:#7b8190}
.student-info{display:grid;grid-template-columns:1fr 220px;gap:14px}
label{font-weight:700;display:block;margin-bottom:6px}
input[type=text],select,textarea{width:100%;padding:11px 12px;border:1px solid #bcc8c3;border-radius:9px;font-size:16px;background:#fff}
textarea{min-height:90px;resize:vertical}
.task-row{padding:18px 0;border-top:1px solid var(--line)}
.task-row:first-child{border-top:0}
.phrase{font-weight:800;color:var(--navy)}
.meaning{color:var(--muted)}
.submit-btn{border:0;background:var(--navy);color:#fff;padding:13px 20px;border-radius:10px;font-weight:800;cursor:pointer}
.submit-btn:hover{background:var(--red)}
.feedback{display:none;margin-top:12px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.feedback.show{display:block}
.fb-head{padding:10px 12px;font-weight:800;background:#F0F3F8}
.fb-body{padding:12px}
.good{color:var(--navy2)} .bad{color:var(--red)}
.sample{background:var(--blue);border-left:4px solid var(--navy2);padding:10px 12px;margin-top:10px}
.warning{background:var(--redlight);border-left:4px solid var(--red);padding:10px 12px;margin-top:10px}
.note{color:var(--muted);font-size:14px}
.coming{color:#777;font-style:italic;margin-top:8px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.unit-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.grid,.unit-grid,.student-info{grid-template-columns:1fr}}
</style></head><body>
<header><div class="brand"><img src="../../images/logo_banner.png" alt="Anh ngữ Ms. Kim"></div></header>
<main><a class="back" href="../">← Back to Global Success</a>
<section class="hero"><h1>Class 12</h1><p>Choose a skill below.</p></section>
<section class="grid"><div class="tile"><h2>Writing</h2><p>Writing practice.</p><a class="button" href="writing/">Writing</a></div></section>
</main></body></html>
