<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Names and Places | PRE-IELTS Listening</title>
<style>
:root{--navy:#0B1F4D;--red:#D71920;--bg:#F5F6F8;--text:#111;--muted:#666}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:3px solid var(--red);padding:18px 20px}
.brand{text-align:center}.brand img{width:min(560px,82vw);height:auto}
main{max-width:1100px;margin:30px auto;padding:0 20px 60px}
.hero,.part-card{background:#fff;border-radius:18px;padding:26px;box-shadow:0 8px 24px rgba(0,0,0,.06);border-top:4px solid var(--navy);margin-bottom:22px}
h1,h2{color:var(--navy)}
.back{display:inline-block;margin-bottom:16px;color:var(--navy);font-weight:700;text-decoration:none}
.exercise-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.exercise-btn{display:block;text-align:center;background:#fff;border:2px solid var(--navy);color:var(--navy);padding:15px 12px;border-radius:12px;font-weight:800;text-decoration:none}
.exercise-btn:hover{background:var(--navy);color:#fff}
@media(max-width:800px){.exercise-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.exercise-grid{grid-template-columns:1fr}}
</style>
</head>
