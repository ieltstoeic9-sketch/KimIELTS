<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercise 9 – Survival English</title><style>
:root{--navy:#0B1F4D;--red:#D71920;--bg:#F5F6F8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#111}

 .placeholder{max-width:700px;margin:auto;text-align:center}.placeholder .button{align-self:center}</style></head><body><header><div class="brand"><img src="../../../../../images/logo_banner.png" alt="Anh ngữ Ms. Kim"></div></header><main><section class="hero placeholder"><h1>Exercise 9</h1><p>This listening exercise is coming soon.</p><p><a class="button" href="../">← Back to Survival English</a></p></section></main></body></html>
