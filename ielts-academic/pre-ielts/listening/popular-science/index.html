<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Popular Science | PRE-IELTS Listening</title>
<style>
:root{
  --navy:#0B1F4D;
  --navy2:#173A7A;
  --red:#D71920;
  --bg:#F5F6F8;
  --text:#111111;
  --muted:#666666;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  background:#fff;
  border-bottom:3px solid var(--red);
  padding:18px 20px;
}
.brand{
  text-align:center;
}
.brand img{
  width:min(560px,82vw);
  height:auto;
}
main{
  max-width:1100px;
  margin:30px auto;
  padding:0 20px 60px;
}
.hero,.card{
  background:#fff;
  border-radius:18px;
  padding:26px;
  box-shadow:0 8px 24px rgba(0,0,0,.06);
  border-top:4px solid var(--navy);
}
.hero{margin-bottom:22px}
h1,h2{color:var(--navy);margin-top:0}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
}
.card{
  min-height:210px;
  display:flex;
  flex-direction:column;
}
.card p{
  line-height:1.5;
  margin:0 0 18px;
}
.button{
  display:inline-block;
  align-self:flex-start;
  margin-top:auto;
  background:var(--navy);
  color:#fff;
  text-decoration:none;
  padding:12px 18px;
  border-radius:10px;
  font-weight:700;
}
.button:hover{background:var(--red)}
.back{
  display:inline-block;
  margin-bottom:16px;
  color:var(--navy);
  font-weight:700;
  text-decoration:none;
}
.coming{
  color:var(--muted);
  font-style:italic;
  margin-top:18px;
}
@media(max-width:700px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="../../../../images/logo_banner.png" alt="Anh ngữ Ms. Kim">
  </div>
</header>

<main>
  <a class="back" href="../">← Back to Listening</a>

  <section class="hero">
    <h1>Popular Science</h1>
    <p>PRE-IELTS Listening practice.</p>
  </section>

  <section class="card">
    <h2>Practice Tests</h2>
    <div class="coming">Coming soon</div>
  </section>
</main>
</body>
</html>
