<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Part 2 - Getting to know each other</title><style>
:root{--navy:#0B1F4D;--navy2:#173A7A;--red:#D71920;--bg:#F5F6F8;--line:#D9DEE8;--blue:#EEF4FF;--redlight:#FFF0F1;--muted:#666}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#111;line-height:1.5}
header{background:#fff;border-bottom:3px solid var(--red);padding:18px 20px}
.brand{text-align:center}.brand img{width:min(560px,82vw);height:auto}
main{max-width:1120px;margin:30px auto;padding:0 20px 70px}
.hero,.card,.person-card{background:#fff;border-radius:18px;padding:26px;box-shadow:0 8px 24px rgba(0,0,0,.06);border-top:4px solid var(--navy);margin-bottom:22px}
h1,h2,h3{color:var(--navy);margin-top:0}
.back{display:inline-block;margin-bottom:16px;color:var(--navy);font-weight:700;text-decoration:none}
.student-info{display:grid;grid-template-columns:1fr 240px;gap:14px}
label{display:block;font-weight:700;margin-bottom:6px}
input[type=text],select{width:100%;padding:11px 12px;border:1px solid #bcc8c3;border-radius:9px;font-size:16px;background:#fff}
.audio-wrap{background:#F4F7FC;border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0}
audio{width:100%;margin-top:8px}
.people-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.person-card{margin:0}
.person-head{display:flex;align-items:center;gap:15px;margin-bottom:18px}
.avatar{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--blue);border:2px solid var(--navy);color:var(--navy);font-size:31px;font-weight:800;flex:0 0 auto}
.question-row{margin-bottom:14px}
.question-row .qtext{font-weight:700;margin-bottom:6px}
.question-row input.correct{border:2px solid var(--navy2);background:var(--blue)}
.question-row input.wrong{border:2px solid var(--red);background:var(--redlight)}
.mini-feedback{display:none;margin-top:6px;font-size:14px}
.mini-feedback.show{display:block}
.person-result{display:none;margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.person-result.show{display:block}
.person-score{background:#F0F3F8;padding:10px 12px;font-weight:800;color:var(--navy)}
.answer-line{padding:9px 12px;border-top:1px solid #edf0ee;font-size:14px}
.script-box{display:none;margin-top:14px;background:#FFFBEF;border-left:4px solid #C78C00;padding:14px;border-radius:8px}
.script-box.show{display:block}
.script-title{font-weight:800;color:#7A5500;margin-bottom:6px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
button.action{border:0;border-radius:10px;padding:13px 20px;font-size:15px;font-weight:800;cursor:pointer}
.check{background:var(--navy);color:#fff}.check:hover{background:var(--red)}
.submit{background:var(--red);color:#fff}.submit:disabled{opacity:.45;cursor:not-allowed}
.summary{display:none;margin-top:18px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.summary.show{display:block}
.summary-head{background:#F0F3F8;padding:12px 14px;font-weight:800;color:var(--navy)}
.good{color:var(--navy2);font-weight:800}.bad{color:var(--red);font-weight:800}
.status{display:none;margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:700}
.status.ok{display:block;background:var(--blue);color:var(--navy)}
.status.err{display:block;background:var(--redlight);color:var(--red)}
.note{color:var(--muted);font-size:14px}
@media(max-width:780px){.people-grid{grid-template-columns:1fr}}
@media(max-width:560px){.student-info{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="brand"><img src="../../../../../images/logo_banner.png" alt="Anh ngữ Ms. Kim"></div></header>
<main>
<a class="back" href="../">← Back to Names and Places</a>
<section class="hero">
<h1>Part 2: Getting to know each other</h1>
<p>All eight self-introductions use one shared audio.</p>
</section>
<section class="card">
<h2>Exercise 1</h2>
<p>Listen to some self-introductions and complete the information about each person.</p>
<a href="exercise1/" style="display:inline-block;background:#0B1F4D;color:#fff;text-decoration:none;padding:13px 20px;border-radius:10px;font-weight:800">Exercise 1</a>
</section>
</main>
</body>
</html>
