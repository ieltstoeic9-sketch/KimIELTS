<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Part 1: The letters of the alphabet - Exercise 1</title>
<style>
:root{
  --navy:#0B1F4D;
  --navy2:#173A7A;
  --red:#D71920;
  --bg:#F5F6F8;
  --text:#111111;
  --muted:#666666;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  background:#fff;
  border-bottom:3px solid var(--red);
  padding:18px 20px;
}
.brand{text-align:center}
.brand img{width:min(560px,82vw);height:auto}
main{
  max-width:1100px;
  margin:30px auto;
  padding:0 20px 60px;
}
.hero,.part-card,.exercise-card{
  background:#fff;
  border-radius:18px;
  padding:26px;
  box-shadow:0 8px 24px rgba(0,0,0,.06);
  border-top:4px solid var(--navy);
}
.hero{margin-bottom:22px}
.part-card{margin-bottom:22px}
h1,h2,h3{color:var(--navy);margin-top:0}
.back{
  display:inline-block;
  margin-bottom:16px;
  color:var(--navy);
  font-weight:700;
  text-decoration:none;
}
.exercise-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}
.exercise-btn{
  display:block;
  text-align:center;
  background:#fff;
  border:2px solid var(--navy);
  color:var(--navy);
  padding:15px 12px;
  border-radius:12px;
  font-weight:800;
  text-decoration:none;
}
.exercise-btn:hover{
  background:var(--navy);
  color:#fff;
}
.coming{
  color:var(--muted);
  font-style:italic;
  margin-top:14px;
}
@media(max-width:800px){
  .exercise-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px){
  .exercise-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="../../../../../../images/logo_banner.png" alt="Anh ngữ Ms. Kim">
  </div>
</header>
<main>
  <a class="back" href="../">← Back to Part 1: The letters of the alphabet</a>
  <section class="hero">
    <h1>Part 1: The letters of the alphabet</h1>
    <p>Exercise 1</p>
  </section>
  <section class="exercise-card">
    <h2>Exercise 1</h2>
    <div class="coming">Coming soon</div>
  </section>
</main>
</body>
</html>
