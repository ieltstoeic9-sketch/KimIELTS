<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRE-IELTS Listening | Anh ngữ Ms. Kim</title>
<style>
:root{--navy:#0B1F4D;--navy2:#173A7A;--red:#D71920;--bg:#F5F6F8;--text:#111;--muted:#666}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:3px solid var(--red);padding:18px 20px}
.brand{text-align:center}.brand img{width:min(560px,82vw);height:auto}
main{max-width:1050px;margin:30px auto;padding:0 20px 60px}
.hero,.card{background:#fff;border-radius:18px;padding:26px;box-shadow:0 8px 24px rgba(0,0,0,.06);border-top:4px solid var(--navy);margin-bottom:22px}
h1,h2{color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.button{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:700}
.button:hover{background:var(--red)}
.back{display:inline-block;margin-bottom:16px;color:var(--navy);font-weight:700;text-decoration:none}
.coming{color:var(--muted);font-style:italic;margin-top:18px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="brand"><img src="../../../images/logo_banner.png" alt="Anh ngữ Ms. Kim"></div></header>
<main>
<a class="back" href="../">← Back to PRE-IELTS</a>
<section class="hero">
<h1>PRE-IELTS — Listening</h1>
<p>Choose a test below.</p>
</section>
<section class="card">
<h2>Listening Tests</h2>
<div class="coming">Coming soon</div>
</section>
</main>
</body>
</html>
