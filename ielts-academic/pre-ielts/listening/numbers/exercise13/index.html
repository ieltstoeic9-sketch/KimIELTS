<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Numbers – Exercise 13</title><style>
:root{--navy:#0B1F4D;--red:#D71920;--bg:#F5F6F8;--line:#D9DEE8;--blue:#EEF4FF;--redlight:#FFF0F1}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#111;line-height:1.5}
header{background:#fff;border-bottom:3px solid var(--red);padding:18px 20px}.brand{text-align:center}.brand img{width:min(560px,82vw)}
main{max-width:1080px;margin:30px auto;padding:0 20px 70px}.hero,.card,.qcard{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.06);border-top:4px solid var(--navy);margin-bottom:22px}
h1,h2,h3{color:var(--navy);margin-top:0}.back{display:inline-block;margin-bottom:16px;color:var(--navy);font-weight:700;text-decoration:none}
.audio-wrap{background:#F4F7FC;border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0}audio{width:100%;margin-top:8px}
.student-info{display:grid;grid-template-columns:1fr 220px;gap:14px}.student-info input,.student-info select,input[type=text]{width:100%;padding:11px 12px;border:1px solid #bcc8c3;border-radius:9px;font-size:16px;background:#fff}
.choice{display:block;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:#fff;margin:8px 0}.choice:has(input:checked){border:2px solid var(--navy);background:var(--blue)}
.row{display:grid;grid-template-columns:minmax(220px,1fr) minmax(120px,260px);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.row .feedback{grid-column:1/-1}
table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--line);padding:12px;text-align:left}th{background:#0B1F4D;color:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.item-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}.item-card img{max-width:100%;height:180px;object-fit:contain}
.feedback{display:none;margin-top:10px;padding:9px 11px;border-radius:9px;font-weight:700}.feedback.show{display:block}.feedback.good{background:var(--blue);color:#173A7A}.feedback.bad{background:var(--redlight);color:var(--red)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.check{background:var(--navy);color:#fff}.reset{background:#E9EDF5;color:var(--navy)}.submit{background:var(--red);color:#fff}.submit:disabled{opacity:.45}
.summary,.status{display:none;margin-top:14px;padding:11px 13px;border-radius:9px;font-weight:700}.summary.show,.status.show{display:block}.summary{background:#F0F3F8;color:var(--navy)}.status{background:var(--blue);color:var(--navy)}
.ordinal-list{columns:3;column-gap:30px}.ordinal-list div{break-inside:avoid;margin:7px 0}
@media(max-width:760px){.grid3,.student-info,.row{grid-template-columns:1fr}.ordinal-list{columns:1}}
</style></head><body><header><div class="brand"><img src="../../../../images/logo_banner.png" alt="Anh ngữ Ms. Kim"></div></header><main><a class="back" href="../">← Back to Numbers</a><section class="hero"><h1>Numbers – Exercise 13</h1></section><section class="card"><h2>Student information</h2><div class="student-info"><div><label>Student name</label><input id="studentName" type="text"></div><div><label>Class</label><select id="studentClass"><option value="">Select class</option><option>PRE-IELTS</option><option>Class 8</option><option>Class 9</option><option>Other</option></select></div></div><div id="submitStatus" class="status"></div></section><section class="card"><div class="audio-wrap"><b>Audio</b><audio controls preload="metadata"><source src="audio/audio.mp3" type="audio/mpeg"></audio></div><p><b>You will hear three dialogues on the telephone. Write the name, day, time and telephone number.</b></p><div class='qcard'><h3>Dialogue 1</h3><p>Note for Mr. Watson</p><div class="row"><label>Name</label><input id="q1" type="text"><div id="fb1" class="feedback"></div></div><div class="row"><label>Day</label><input id="q2" type="text"><div id="fb2" class="feedback"></div></div><div class="row"><label>Time</label><input id="q3" type="text"><div id="fb3" class="feedback"></div></div><div class="row"><label>Telephone number</label><input id="q4" type="text"><div id="fb4" class="feedback"></div></div></div><div class='qcard'><h3>Dialogue 2</h3><p>Note for Dr. Jenkinson</p><div class="row"><label>Name</label><input id="q5" type="text"><div id="fb5" class="feedback"></div></div><div class="row"><label>Day</label><input id="q6" type="text"><div id="fb6" class="feedback"></div></div><div class="row"><label>Time</label><input id="q7" type="text"><div id="fb7" class="feedback"></div></div><div class="row"><label>Telephone number</label><input id="q8" type="text"><div id="fb8" class="feedback"></div></div></div><div class='qcard'><h3>Dialogue 3</h3><p>Note for Professor Hansen</p><div class="row"><label>Name</label><input id="q9" type="text"><div id="fb9" class="feedback"></div></div><div class="row"><label>Day</label><input id="q10" type="text"><div id="fb10" class="feedback"></div></div><div class="row"><label>Time</label><input id="q11" type="text"><div id="fb11" class="feedback"></div></div><div class="row"><label>Telephone number</label><input id="q12" type="text"><div id="fb12" class="feedback"></div></div></div></section><section class="card"><div class="actions"><button class="check" onclick="checkAnswers()">CHECK ANSWERS</button><button class="reset" onclick="resetExercise()">RESET</button></div><div id="summary" class="summary"></div></section><section class="card"><button id="submitBtn" class="submit" onclick="submitResult()" disabled>SUBMIT RESULT</button></section><iframe name='sink' style='display:none'></iframe><script>
const RESULT_ENDPOINT="https://script.google.com/macros/s/AKfycbxNZI7NGT6KW-5L9rIrjXQHZJLxLuAeXzTICfrSPQFAIpy5pQ7Ce1s78b5wNRKre3XH/exec";let checked=false,score=0,submissionLocked=false;
function norm(s){return String(s||'').trim().toLowerCase().replace(/[£$,]/g,'').replace(/\s+/g,' ').replace(/[–—]/g,'-');}
function validateStudent(){if(!document.getElementById('studentName').value.trim()||!document.getElementById('studentClass').value){alert('Please enter Student name and select Class first.');return false;}return true;}
function fb(i,ok,c){const e=document.getElementById('fb'+i);e.className='feedback show '+(ok?'good':'bad');e.innerHTML=ok?'✓ Correct':`✗ Incorrect — Correct answer: <b>${c}</b>`;}
function finish(){checked=true;document.getElementById('submitBtn').disabled=false;const s=document.getElementById('summary');s.className='summary show';s.textContent=`Score: ${score}/12`;}
function submitResult(){if(!checked||submissionLocked||!validateStudent())return;const payload={activityType:'listening',studentName:document.getElementById('studentName').value.trim(),className:document.getElementById('studentClass').value,courseName:'PRE-IELTS',skillName:'Listening',testName:'Numbers Exercise 13',score,total:12,correct:score,incorrect:12-score,correctRate:Math.round(score*10000/12)/100};let f=document.createElement('form');f.method='POST';f.action=RESULT_ENDPOINT;f.target='sink';f.style.display='none';let inp=document.createElement('input');inp.type='hidden';inp.name='payload';inp.value=JSON.stringify(payload);f.appendChild(inp);document.body.appendChild(f);f.submit();submissionLocked=true;let b=document.getElementById('submitBtn');b.disabled=true;b.textContent='Submitted ✓';let st=document.getElementById('submitStatus');st.className='status show';st.textContent='✓ Result submitted';setTimeout(()=>f.remove(),2500);}
const keys=[["Richard Priest"], ["next Monday", "Monday"], ["10:15", "10.15"], ["421 7896", "4217896"], ["Rita Harper"], ["Friday"], ["2:40", "2.40"], ["563 2860", "5632860"], ["David Bell"], ["Tuesday"], ["3:30", "3.30"], ["859 7783", "8597783"]];function compact(v){return norm(v).replace(/\s+/g,'').replace(/\./g,':');}function checkAnswers(){if(!validateStudent())return;score=0;keys.forEach((arr,i)=>{const v=compact(document.getElementById('q'+(i+1)).value);const ok=arr.map(compact).includes(v);if(ok)score++;fb(i+1,ok,arr[0]);});finish();}
function resetExercise(){document.querySelectorAll('input[type=text]').forEach(x=>x.value='');document.querySelectorAll('.feedback').forEach(x=>x.className='feedback');document.getElementById('summary').className='summary';checked=false;submissionLocked=false;document.getElementById('submitBtn').disabled=true;document.getElementById('submitBtn').textContent='SUBMIT RESULT';}</script></main></body></html>
