<style>
:root{--navy:#0b1f4d;--red:#d71920;--bg:#f5f6f8}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#111;line-height:1.5}
header{background:#fff;border-bottom:3px solid var(--red);text-align:center;padding:18px 20px}
header img{display:block;width:min(650px,92vw);height:auto;margin:auto}
main{max-width:1140px;margin:30px auto;padding:0 20px 70px}
.back{display:inline-block;margin-bottom:18px;text-decoration:none;color:var(--navy);font-weight:700}
.back:hover{text-decoration:underline}
.card{border-top:4px solid var(--navy);background:#fff;border-radius:20px;padding:28px;margin-bottom:24px;box-shadow:0 9px 25px rgba(0,0,0,.05)}
h1,h2{color:var(--navy);margin:14px 0 16px}h1{font-size:36px}h2{font-size:26px}
.passages-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.passage{min-height:84px;display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid #d8e0ef;border-radius:12px;padding:17px 20px;text-decoration:none;color:var(--navy);background:#f9fbff;transition:background .15s,border-color .15s}
.passage:hover,.passage:focus-visible{background:#edf4ff;border-color:var(--navy);outline-offset:2px}
.passage-title{font-size:19px;font-weight:800}
.arrow{font-size:26px;line-height:1;font-weight:700}
@media(max-width:760px){.passages-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:540px){main{padding:0 14px;margin:20px auto}.card{padding:22px 18px}h1{font-size:28px}h2{font-size:22px}.passages-grid{grid-template-columns:1fr}.passage-title{font-size:17px}}
