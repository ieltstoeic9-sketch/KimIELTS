<script>
const D=window.TEST_DATA;let answers={},checked=false,scored=[],submitted=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const heading=(n,title,instr)=>`<section class="part" id="part${n}"><h2>PART ${n} – ${title}</h2><p class="hint">${esc(instr)}</p>`;
let out=heading(1,'Picture Multiple Choice','Choose the correct picture A, B or C for questions 1–5.');
D.questions.slice(0,5).forEach(q=>{
 out+=`<section class="question" id="q${q.n}"><h3>${q.n}. ${esc(q.q)}</h3>`;
 if(q.n===1){out+=`<img class="map" src="assets/q1_map.png" alt="Sports centre map with positions A B C"><div class="choices">${'ABC'.split('').map(c=>`<button class="choice" type="button" data-q="1" data-a="${c}">${c}</button>`).join('')}</div>`}
 else{out+=`<div class="pics">${'ABC'.split('').map(c=>`<button class="pic" type="button" data-q="${q.n}" data-a="${c}"><img src="assets/q${q.n}_${c}.png" alt="Question ${q.n} option ${c}"><span class="letter">${c}</span></button>`).join('')}</div>`}
 out+=`<div class="feedback" id="f${q.n}"></div></section>`});out+='</section>';
out+=heading(2,'Matching','Listen to Jane talking to a friend about clothes she has bought for her holiday. What colours are her clothes?');
out+=`<div class="match"><div><h3>CLOTHES</h3>${D.questions.slice(5,10).map(q=>`<label for="a${q.n}"><span><span class="num">${q.n}</span> &nbsp; ${esc(q.q)}</span><select id="a${q.n}" data-input="${q.n}"><option value="">—</option>${Object.keys(D.placeOptions).map(k=>`<option value="${k}">${k}</option>`).join('')}</select></label><div class="feedback" id="f${q.n}"></div>`).join('')}</div><div class="places"><h3>COLOURS</h3>${Object.entries(D.placeOptions).map(([k,v])=>`<p><strong>${k}</strong> &nbsp; ${esc(v)}</p>`).join('')}</div></div><div class="fullscript" id="script2"></div></section>`;
out+=heading(3,'Multiple Choice','Listen to Mrs Lee talking to her secretary about her business trip.');
D.questions.slice(10,15).forEach(q=>{out+=`<div class="question" id="q${q.n}"><h3>${q.n}. ${esc(q.q)}</h3><div class="choices">${q.opts.map((v,i)=>`<button type="button" class="choice" data-q="${q.n}" data-a="${'ABC'[i]}"><strong>${'ABC'[i]}</strong> &nbsp; ${esc(v)}</button>`).join('')}</div><div class="feedback" id="f${q.n}"></div></div>`});out+='<div class="fullscript" id="script3"></div></section>';
out+=heading(4,'Gap Filling','You will hear a man asking for information about a language school.');
out+='<div class="question"><h2 style="text-align:center">School of Italian Studies</h2><div class="formline"><strong>Length of courses:</strong><span>6 or 9 months</span></div>';
[['Next course begins on:',16,'',''],['Number of students in each class:',17,'',''],['Cost of coursebook:',18,'£',''],['School hours – Saturday:',19,'From:',''],['Nearest underground station:',20,'','']].forEach(([label,n,prefix,suffix])=>{out+=`<div class="formline"><strong>${label}</strong><div><span class="num">${n}.</span> ${esc(prefix)} <input class="blank" id="a${n}" data-input="${n}" aria-label="Answer ${n}" autocomplete="off"> ${esc(suffix)}<div class="feedback" id="f${n}"></div></div></div>`});out+='</div><div class="fullscript" id="script4"></div></section>';
out+=heading(5,'Gap Filling','You will hear a man talking about a day trip.');
out+='<div class="question"><h2 style="text-align:center">DAY TRIP</h2><div class="formline"><strong>Leave:</strong><span>9.30 a.m.</span></div>';
[['Trip will take:',21,'','hours'],['Stop 1:',22,'',''],['Stop 2:',23,'','at 1 o’clock'],['Stop 3:',24,'',''],['Take your:',25,'','']].forEach(([label,n,prefix,suffix])=>{out+=`<div class="formline"><strong>${label}</strong><div><span class="num">${n}.</span> ${esc(prefix)} <input class="blank" id="a${n}" data-input="${n}" aria-label="Answer ${n}" autocomplete="off"> ${esc(suffix)}<div class="feedback" id="f${n}"></div></div></div>`});out+='</div><div class="fullscript" id="script5"></div></section>';
$('#test').innerHTML=out;
document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{if(checked)return;const n=+b.dataset.q;answers[n]=b.dataset.a;document.querySelectorAll(`[data-q="${n}"]`).forEach(x=>x.classList.toggle('selected',x===b))}));
document.querySelectorAll('[data-input]').forEach(e=>e.addEventListener('input',()=>{answers[+e.dataset.input]=e.value}));
function norm(s){return String(s||'').toLowerCase().trim().replace(/[’']/g,"'").replace(/[.,]/g,'').replace(/[–—-]/g,' ').replace(/\s+/g,' ')}
const variants={16:['next monday','monday'],17:['15','fifteen','about 15','about fifteen'],18:['12.99','£12.99','12 pounds 99','twelve pounds ninety nine','12 pounds ninety nine'],19:['9 a.m. to 1 p.m.','9 am to 1 pm','9 to 1','nine to one','9am to 1pm','9 oclock to 1 oclock','9 1'],20:['green park'],21:['7','seven','7 hours','seven hours'],22:['castle','a castle'],23:['cafe','café','lunch','cafe for lunch','café for lunch'],24:['beach','lake','a beach','the beach','the lake'],25:['camera','a camera']};
function acceptable(n,a){const v=norm(a);if(n<=15)return v===norm(D.questions[n-1].key);return (variants[n]||[]).some(x=>norm(x)===v)}
function highlight(s,part,isVi){const all=Object.entries(D.partMap).filter(([n,p])=>p===part).map(([n])=>Number(n));let marks=[];for(const n of all){const phrase=D.evidence[n]?.[isVi?1:0];if(!phrase)continue;const at=s.toLowerCase().indexOf(phrase.toLowerCase());if(at>=0&&!marks.some(m=>at<m.end&&at+phrase.length>m.start))marks.push({start:at,end:at+phrase.length,n})}marks.sort((a,b)=>a.start-b.start);let result='',from=0;for(const m of marks){result+=esc(s.slice(from,m.start))+'<span class="ev">'+esc(s.slice(m.start,m.end))+'</span> <span class="qtag">('+(isVi?'Câu ':'Question ')+m.n+')</span>';from=m.end}return result+esc(s.slice(from))}
function scriptHTML(part){const lines=D.scripts[part]||[];const column=(i,vi)=>`<div class="script-cell">${lines.map(r=>'<p><strong>'+esc(r[0])+':</strong> '+highlight(r[i],part,vi)+'</p>').join('')}</div>`;return '<div class="script-grid">'+column(1,false)+column(2,true)+'</div>'}
for(const [part,prefix] of [[6,2],[11,3],[16,4],[21,5]]){$('#script'+prefix).innerHTML=scriptHTML(part)}
$('#check').addEventListener('click',()=>{const name=$('#studentName').value.trim(),grade=$('#studentClass').value;if(!name||!grade){$('#status').textContent='Please enter your name and Grade before checking answers.';return}checked=true;scored=D.questions.map(q=>{const entered=answers[q.n]||'',ok=acceptable(q.n,entered),fb=$('#f'+q.n);fb.style.display='block';fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=`<p><strong><span class="result-icon">${ok?'✓':'✗'}</span>${ok?'Correct':'Incorrect'}</strong>${ok?'':` · <span style="color:#172639">Correct answer:</span> <strong style="color:#102b60">${esc(q.key)}</strong>`} · Your answer: ${esc(entered||'—')}</p>${q.n<=5?`<div class="review-script">${scriptHTML(q.n)}</div>`:''}`;return {n:q.n,answer:entered,key:q.key,correct:ok}});
 for(let i=2;i<=5;i++)$('#script'+i).style.display='block';const score=scored.filter(x=>x.correct).length;$('#summary').innerHTML=`<strong>RESULT: ${score}/25 · ${Math.round(score/25*100)}% correct</strong>`;$('#submit').disabled=false;$('#check').disabled=true;document.querySelectorAll('input.blank,select[data-input]').forEach(e=>e.disabled=true);$('#status').textContent='Answers checked. Review the highlighted evidence and bilingual scripts.';$('#summary').scrollIntoView({behavior:'smooth',block:'center'})});
$('#reset').addEventListener('click',()=>{answers={};checked=false;scored=[];document.querySelectorAll('[data-q]').forEach(b=>b.classList.remove('selected'));document.querySelectorAll('[data-input]').forEach(e=>{e.value='';e.disabled=false});document.querySelectorAll('.feedback,.fullscript').forEach(e=>e.style.display='none');$('#summary').textContent='';$('#status').textContent='';$('#check').disabled=false;$('#submit').disabled=true;submitted=false;$('#submit').textContent='SUBMIT RESULT';window.scrollTo({top:0,behavior:'smooth'})});
$('#submit').addEventListener('click',()=>{if(!checked||submitted)return;const name=$('#studentName').value.trim(),cls=$('#studentClass').value;if(!name||!cls){$('#status').textContent='Please enter student name and Grade.';return}const count=scored.filter(x=>x.correct).length;const payload={activityType:'listening',studentName:name,className:cls,courseName:'A2',skillName:'Listening',testName:'Test 7',score:count,total:25,correct:count,incorrect:25-count,correctRate:Math.round(count*10000/25)/100,answers:scored.map(x=>({question:x.n,answer:x.answer,correctAnswer:x.key,isCorrect:x.correct}))};const frame=document.createElement('iframe');frame.name='test7ResultFrame';frame.style.display='none';document.body.appendChild(frame);const form=document.createElement('form');form.method='POST';form.action=window.GOOGLE_SCRIPT_URL;form.target=frame.name;form.style.display='none';const field=document.createElement('input');field.type='hidden';field.name='payload';field.value=JSON.stringify(payload);form.appendChild(field);document.body.appendChild(form);try{form.submit();submitted=true;$('#submit').disabled=true;$('#submit').textContent='SUBMITTED ✓';$('#status').textContent='Result submission sent to WEB RESULTS. Please verify it appears in Google Sheets.';setTimeout(()=>form.remove(),3000)}catch(e){$('#status').textContent='Could not submit result. Please retry.';form.remove();frame.remove()}});
</script>
<script id="kim-cambridge-player">
(function(){
  const make=(tag,cls)=>{const el=document.createElement(tag);if(cls)el.className=cls;return el};
  const format=(s)=>{if(!Number.isFinite(s)||s<0)return '00:00';s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
  const skipIcon=(back)=>back?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.4 6.1"/><path d="M3 4v7h7"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11a9 9 0 1 0-2.4 6.1"/><path d="M21 4v7h-7"/></svg>';
  const playIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const pauseIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  function init(){
    const main=document.querySelector('main');
    const panel=document.querySelector('.audio-wrap,.audio-panel');
    if(!main||!panel||panel.classList.contains('kim-sticky-audio'))return;
    const audio=panel.querySelector('audio');if(!audio)return;
    // Detach the existing player once; keeping the audio node preserves source and playback state.
    const intro=main.querySelector('.opening,.hero,.card');
    if(intro)intro.insertAdjacentElement('afterend',panel);
    else main.insertBefore(panel,main.firstChild);
    panel.classList.add('kim-sticky-audio');
    audio.removeAttribute('controls');audio.preload='metadata';
    audio.setAttribute('aria-label','Full test audio');
    const header=make('div','kim-audio-heading'),title=panel.querySelector('h2,b,strong');
    if(title){title.classList.add('kim-audio-title');header.appendChild(title)}
    else {const t=make('strong','kim-audio-title');t.textContent='Listening Audio';header.appendChild(t)}
    
    panel.insertBefore(header,panel.firstChild);
    const controls=make('div','kim-cambridge-controls');
    function skipBtn(back){const b=make('button','kim-skip');b.type='button';b.title=back?'Rewind 10 seconds':'Forward 10 seconds';b.setAttribute('aria-label',b.title);b.innerHTML=skipIcon(back)+'<span>10s</span>';
      b.addEventListener('click',()=>{const delta=back?-10:10,d=audio.duration;try{audio.currentTime=Math.max(0,Math.min(Number.isFinite(d)?d:Infinity,audio.currentTime+delta))}catch(e){} });return b}
    const toggle=make('button','kim-toggle');toggle.type='button';toggle.title='Play audio';toggle.setAttribute('aria-label','Play audio');toggle.innerHTML=playIcon;
    controls.append(skipBtn(true),toggle,skipBtn(false));panel.appendChild(controls);
    const progress=make('div','kim-cambridge-progress');
    const current=make('span','kim-cambridge-time'),total=make('span','kim-cambridge-time');current.textContent='00:00';total.textContent='00:00';
    const seek=make('input');seek.type='range';seek.min='0';seek.max='1000';seek.step='1';seek.value='0';seek.setAttribute('aria-label','Seek audio timeline');
    progress.append(current,seek,total);panel.appendChild(progress);
    const footer=make('div','kim-cambridge-footer'),volwrap=make('label','kim-cambridge-volume');
    volwrap.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM17 9a5 5 0 0 1 0 6M19 6a9 9 0 0 1 0 12"/></svg>';
    const vol=make('input');vol.type='range';vol.min='0';vol.max='100';vol.step='1';vol.value=String(Math.round(audio.volume*100));vol.setAttribute('aria-label','Audio volume');volwrap.appendChild(vol);footer.appendChild(volwrap);panel.appendChild(footer);
    const err=make('div','kim-cambridge-error');err.setAttribute('role','status');panel.appendChild(err);
    function sync(){const duration=Number.isFinite(audio.duration)?audio.duration:0;current.textContent=format(audio.currentTime);total.textContent=format(duration);seek.value=duration?String(Math.round(audio.currentTime/duration*1000)):'0';seek.style.setProperty('--fill',((Number(seek.value)/10)||0)+'%');toggle.innerHTML=audio.paused?playIcon:pauseIcon;toggle.title=audio.paused?'Play audio':'Pause audio';toggle.setAttribute('aria-label',toggle.title)}
    toggle.addEventListener('click',()=>{if(audio.paused){const play=audio.play();if(play&&play.catch)play.catch(()=>{err.textContent='Audio could not play. Check the MP3 file.';sync()})}else audio.pause()});
    seek.addEventListener('input',()=>{const d=audio.duration;if(Number.isFinite(d)&&d>0){try{audio.currentTime=d*Number(seek.value)/1000}catch(e){}}sync()});
    vol.addEventListener('input',()=>{audio.volume=Number(vol.value)/100;vol.style.setProperty('--fill',vol.value+'%')});vol.style.setProperty('--fill',vol.value+'%');
    ['loadedmetadata','durationchange','timeupdate','play','pause','ended','seeked'].forEach(event=>audio.addEventListener(event,sync));
    audio.addEventListener('error',()=>{err.textContent='Audio could not load. Please check the MP3 file path.'});
    sync();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
