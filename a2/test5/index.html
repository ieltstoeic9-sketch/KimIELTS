function norm(s){return String(s||'').toLowerCase().trim().replace(/[’']/g,'').replace(/[-–]/g,' ').replace(/\s+/g,' ').replace(/\.$/,'')}
const variants={16:['hyde'],17:['factory'],18:['11.30','11:30','1130','half past eleven','eleven thirty'],19:['21','twenty one','twentyone'],20:['photograph','photographs','photo','photos'],21:['7.30','7:30','730','half past seven','seven thirty'],22:['car park','big car park','the big car park','car park behind hotel','car park behind the hotel','big car park behind hotel','big car park behind the hotel','the big car park behind the hotel'],23:['pink'],24:['office','the office'],25:['jacket','a jacket']};
function acceptable(n,a){const v=norm(a);if(n<=15)return v===norm(D.questions[n-1].key);if(variants[n].some(x=>norm(x)===v))return true;if([17,20,24,25].includes(n)){let core={17:'factory',20:'photo',24:'office',25:'jacket'}[n];if(n===20)return /^(?:photo(?:graph)?s?)$/.test(v)|| /^(?:fotograph|fotographs|foto|fotos)$/.test(v);if(n===17)return ['factori','factery'].includes(v);if(n===24)return ['ofice','the ofice'].includes(v);if(n===25)return ['jaket','a jaket'].includes(v)}return false}
function highlightEvidence(text,n,translation=false){
 const phrases=translation?{
 1:'ăn cá thì sao',2:'hai giờ rưỡi',3:'đọc lá thư này của John',4:'mỗi vé có giá chín mươi đô la',5:'cạnh một siêu thị lớn',6:'mẹ mình sẽ đến tiệm làm tóc',7:'giúp cô ấy mua giày mới',8:'Len thích nhạc cổ điển nên anh ấy sẽ đi',9:'đến trường dạy lái xe',10:'tối nay ông ấy có một buổi học',11:'chỉ có khoảng hai mươi bảng',12:'Chỉ có găng tay',13:'một chiếc túi cũ',14:'mất túi khoảng mười giờ',15:'gọi trước mười giờ sáng',16:'H-Y-D-E',17:'về nhà máy mới',18:'mười một giờ rưỡi',19:'phòng 21',20:'mang theo những bức ảnh',21:'ăn sáng lúc bảy giờ rưỡi',22:'bãi đỗ xe lớn phía sau khách sạn',23:'vé ăn trưa màu hồng',24:'lấy ở văn phòng',25:'mang theo áo khoác'}:{
 1:'what about fish',2:'half past two',3:'read this letter from John',4:'tickets cost ninety dollars each',5:'next to a big supermarket',6:'mother’s going to the hairdresser',7:'help her buy some new shoes',8:'Len loves classical music, so he’ll go',9:'going to the driving school',10:'he’s got a class this evening',11:'there was only about twenty',12:'Just my gloves',13:'it was an old one',14:'I lost it about ten o’clock',15:'phone before ten in the morning',16:'H-Y-D-E',17:'about the new factory',18:'half past eleven',19:'Room 21',20:'bring the photographs',21:'breakfast at half past seven',22:'big car park behind the hotel',23:'pink tickets',24:'from the office',25:'bring a jacket'};
 // Find all evidence spans first; add a question marker immediately after each one.
 // Work on the original string so inserted HTML does not shift later matches.
 const relevant=n?[n]:Object.keys(phrases).map(Number);
 const marks=[];
 for(const q of relevant){
  const phrase=phrases[q];
  const at=text.toLocaleLowerCase().indexOf(phrase.toLocaleLowerCase());
  if(at<0)continue;
  const overlap=marks.some(m=>at<m.end && at+phrase.length>m.start);
  if(!overlap)marks.push({start:at,end:at+phrase.length,q});
 }
 marks.sort((a,b)=>a.start-b.start);
 let html='',from=0;
 for(const m of marks){

 }
 return html+esc(text.slice(from));
