const D=window.TEST_DATA;let answers={},checked=false;const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const heading=(n,title,instr)=>`<section class="part" id="part${n}"><h2>PART ${n} – ${title}</h2><p class="hint">${esc(instr)}</p>`;let out=heading(1,'Picture Multiple Choice','Choose the correct picture A, B or C for questions 1–5.');
D.questions.slice(0,5).forEach(q=>{out+=`<section class="question" id="q${q.n}"><h3>${q.n}. ${esc(q.q)}</h3>`;if(q.n!==5){out+=`<div class="pics">${'ABC'.split('').map(c=>`<button class="pic" data-q="${q.n}" data-a="${c}"><img src="assets/q${q.n}_${c}.png" alt="Question ${q.n} option ${c}"><span class="letter">${c}</span></button>`).join('')}</div>`}else{out+=`<img class="map" src="assets/q5_map.png" alt="Map showing the three possible chemist locations marked A, B and C"><div class="choices">${'ABC'.split('').map(c=>`<button class="choice" data-q="5" data-a="${c}">${c}</button>`).join('')}</div>`}out+=`<div class="feedback" id="f${q.n}"></div></section>`});out+='</section>';
out+=heading(2,'Matching','Listen to Kate telling Emma about her family. Where is each person going today?');out+=`<div class="match"><div><h3>PEOPLE</h3>${D.questions.slice(5,10).map(q=>`<label for="a${q.n}"><span><span class="num">${q.n}</span> &nbsp; ${esc(q.q)}</span><select id="a${q.n}" data-input="${q.n}"><option value="">—</option>${Object.keys(D.placeOptions).map(k=>`<option value="${k}">${k}</option>`).join('')}</select></label><div class="feedback" id="f${q.n}"></div>`).join('')}</div><div class="places"><h3>PLACES</h3>${Object.entries(D.placeOptions).map(([k,v])=>`<p><strong>${k}</strong> &nbsp; ${esc(v)}</p>`).join('')}</div></div><div class="fullscript" id="script2"></div></section>`;
out+=heading(3,'Multiple Choice','Listen to a woman talking to a policeman.');D.questions.slice(10,15).forEach(q=>{out+=`<div class="question" id="q${q.n}"><h3>${q.n}. ${esc(q.q)}</h3><div class="choices">${q.opts.map((v,i)=>`<button class="choice" data-q="${q.n}" data-a="${'ABC'[i]}"><strong>${'ABC'[i]}</strong> &nbsp; ${esc(v)}</button>`).join('')}</div><div class="feedback" id="f${q.n}"></div></div>`});out+='<div class="fullscript" id="script3"></div></section>';
out+=heading(4,'Message Completion','You will hear a man speaking on the telephone. He wants to speak to Miss Dixon, but she is not there.');out+='<div class="question"><h2 style="text-align:center">Message</h2><div class="formline"><strong>TO:</strong><span>Miss Dixon</span></div>';[['FROM:',16,'Mr'],['Meeting about:',17,'new'],['On:','','Wednesday'],['Time:',18,''],['In:',19,'room'],['Please take:',20,'']].forEach(([label,n,prefix])=>{out+=`<div class="formline"><strong>${label}</strong><div>${n?`<span class="num">${n}.</span> ${prefix} <input class="blank" id="a${n}" data-input="${n}" aria-label="Answer ${n}" autocomplete="off"><div class="feedback" id="f${n}"></div>`:prefix}</div></div>`});out+='</div><div class="fullscript" id="script4"></div></section>';

$('#test').innerHTML=out;document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{if(checked)return;let n=+b.dataset.q;answers[n]=b.dataset.a;document.querySelectorAll(`[data-q="${n}"]`).forEach(x=>x.classList.toggle('selected',x===b))}));document.querySelectorAll('[data-input]').forEach(e=>e.addEventListener('input',()=>{answers[+e.dataset.input]=e.value}));
function norm(s){return String(s||'').toLowerCase().trim().replace(/[’']/g,'').replace(/[-–]/g,' ').replace(/\s+/g,' ').replace(/\.$/,'')}
const variants={16:['hyde'],17:['factory'],18:['11.30','11:30','1130','half past eleven','eleven thirty'],19:['21','twenty one','twentyone'],20:['photograph','photographs','photo','photos'],21:['7.30','7:30','730','half past seven','seven thirty'],22:['car park','big car park','the big car park','car park behind hotel','car park behind the hotel','big car park behind hotel','big car park behind the hotel','the big car park behind the hotel'],23:['pink'],24:['office','the office'],25:['jacket','a jacket']};
function acceptable(n,a){const v=norm(a);if(n<=15)return v===norm(D.questions[n-1].key);if(variants[n].some(x=>norm(x)===v))return true;if([17,20,24,25].includes(n)){let core={17:'factory',20:'photo',24:'office',25:'jacket'}[n];if(n===20)return /^(?:photo(?:graph)?s?)$/.test(v)|| /^(?:fotograph|fotographs|foto|fotos)$/.test(v);if(n===17)return ['factori','factery'].includes(v);if(n===24)return ['ofice','the ofice'].includes(v);if(n===25)return ['jaket','a jaket'].includes(v)}return false}
function highlightEvidence(text,n,translation=false){
 const phrases=translation?{
 1:'ăn cá thì sao',2:'hai giờ rưỡi',3:'đọc lá thư này của John',4:'mỗi vé có giá chín mươi đô la',5:'cạnh một siêu thị lớn',6:'mẹ mình sẽ đến tiệm làm tóc',7:'giúp cô ấy mua giày mới',8:'Len thích nhạc cổ điển nên anh ấy sẽ đi',9:'đến trường dạy lái xe',10:'tối nay ông ấy có một buổi học',11:'chỉ có khoảng hai mươi bảng',12:'Chỉ có găng tay',13:'một chiếc túi cũ',14:'mất túi khoảng mười giờ',15:'gọi trước mười giờ sáng',16:'H-Y-D-E',17:'về nhà máy mới',18:'mười một giờ rưỡi',19:'phòng 21',20:'mang theo những bức ảnh',21:'ăn sáng lúc bảy giờ rưỡi',22:'bãi đỗ xe lớn phía sau khách sạn',23:'vé ăn trưa màu hồng',24:'lấy ở văn phòng',25:'mang theo áo khoác'}:{
 1:'what about fish',2:'half past two',3:'read this letter from John',4:'tickets cost ninety dollars each',5:'next to a big supermarket',6:'mother’s going to the hairdresser',7:'help her buy some new shoes',8:'Len loves classical music, so he’ll go',9:'going to the driving school',10:'he’s got a class this evening',11:'there was only about twenty',12:'Just my gloves',13:'it was an old one',14:'I lost it about ten o’clock',15:'phone before ten in the morning',16:'H-Y-D-E',17:'about the new factory',18:'half past eleven',19:'Room 21',20:'bring the photographs',21:'breakfast at half past seven',22:'big car park behind the hotel',23:'pink tickets',24:'from the office',25:'bring a jacket'};
 // Find all evidence spans first; add a question marker immediately after each one.
 // Work on the original string so inserted HTML does not shift later matches.
 const relevant=n?[n]:Object.keys(phrases).map(Number);
 const marks=[];
 for(const q of relevant){
  const phrase=phrases[q];
  const at=text.toLocaleLowerCase().indexOf(phrase.toLocaleLowerCase());
  if(at<0)continue;
  const overlap=marks.some(m=>at<m.end && at+phrase.length>m.start);
  if(!overlap)marks.push({start:at,end:at+phrase.length,q});
 }
 marks.sort((a,b)=>a.start-b.start);
 let html='',from=0;
 for(const m of marks){
  html+=esc(text.slice(from,m.start));
  html+='<span class="ev">'+esc(text.slice(m.start,m.end))+'</span> <span class="qtag">('+(translation?'Câu ':'Question ')+m.q+')</span>';
  from=m.end;
 }
 return html+esc(text.slice(from));
}
function scriptHTML(lines,translation,n){
 const translated=lines.map(([s,t],i)=>[s,translation[i]||'']);
 const column=(items,isVi)=>'<div class="script-cell">'+items.map(([s,t])=>'<p><strong>'+esc(s)+':</strong> '+highlightEvidence(t,n,isVi)+'</p>').join('')+'</div>';

}
const audioscripts=D.scripts;
for(let i=5;i<audioscripts.length;i++){$(`#script${i-3}`).innerHTML='<h3>Script</h3>'+scriptHTML(audioscripts[i],D.translations[i]);}
let scored=[];$('#check').addEventListener('click',()=>{const name=$('#studentName').value.trim(),cls=$('#studentClass').value;if(!name||!cls){$('#status').textContent='Please enter your name and class before checking answers.';return}checked=true;scored=D.questions.map(q=>{let entered=answers[q.n]||'',ok=acceptable(q.n,entered),fb=$(`#f${q.n}`);fb.style.display='block';fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=`<p><strong><span class="result-icon">${ok?'✓':'✗'}</span>${ok?'Correct':'Incorrect — Correct answer: '+esc(q.key)}</strong> · Your answer: ${esc(entered||'—')}</p><p><strong>Evidence:</strong> “${esc(q.e)}”</p>${q.n<=5?`<div class="review-script"><h3>Script</h3>${scriptHTML(audioscripts[q.n-1],D.translations[q.n-1],q.n)}</div>`:""}`;return {n:q.n,answer:entered,key:q.key,correct:ok}});for(let i=2;i<=5;i++){$(`#script${i}`).style.display='block'}let score=scored.filter(x=>x.correct).length;$('#summary').innerHTML=`<strong>RESULT: ${score}/25 · ${Math.round(score/25*100)}% correct</strong>`;$('#submit').disabled=false;$('#check').disabled=true;document.querySelectorAll('input.blank,select[data-input]').forEach(e=>e.disabled=true);$('#status').textContent='Answers checked. Review evidence and the full scripts below each part.';$('#summary').scrollIntoView({behavior:'smooth',block:'center'})});
$('#reset').addEventListener('click',()=>{answers={};checked=false;scored=[];document.querySelectorAll('[data-q]').forEach(b=>b.classList.remove('selected'));document.querySelectorAll('[data-input]').forEach(e=>{e.value='';e.disabled=false});document.querySelectorAll('.feedback,.fullscript').forEach(e=>{e.style.display='none'});$('#summary').textContent='';$('#status').textContent='';$('#check').disabled=false;$('#submit').disabled=true;submitted=false;$('#submit').textContent='SUBMIT RESULT';window.scrollTo({top:0,behavior:'smooth'})});
// Same result schema and hidden-form transport as the working Test 4.
let submitted=false;
$('#submit').addEventListener('click',()=>{
 if(!checked || submitted)return;
 const name=$('#studentName').value.trim(), cls=$('#studentClass').value;
 if(!name||!cls){$('#status').textContent='Please enter student name and class.';return;}
 const count=scored.filter(x=>x.correct).length;
 const payload={activityType:'listening',studentName:name,className:cls,courseName:'A2',skillName:'Listening',testName:'Test 5',score:count,total:25,correct:count,incorrect:25-count,correctRate:Math.round(count*10000/25)/100,answers:scored.map(x=>({question:x.n,answer:x.answer,correctAnswer:x.key,isCorrect:x.correct}))};
 const frame=document.createElement('iframe');frame.name='test5ResultFrame';frame.style.display='none';document.body.appendChild(frame);
 const form=document.createElement('form');form.method='POST';form.action=window.GOOGLE_SCRIPT_URL;form.target=frame.name;form.style.display='none';
 const field=document.createElement('input');field.type='hidden';field.name='payload';field.value=JSON.stringify(payload);form.appendChild(field);document.body.appendChild(form);
 try {form.submit();submitted=true;$('#submit').disabled=true;$('#submit').textContent='SUBMITTED ✓';$('#status').textContent='Result submission sent to WEB RESULTS. Please verify it appears in Google Sheets.';setTimeout(()=>form.remove(),3000)}
 catch(e){$('#status').textContent='Could not submit result. Please retry.';form.remove();frame.remove()}
});
</script>
<script id="kim-cambridge-player">
(function(){
  const make=(tag,cls)=>{const el=document.createElement(tag);if(cls)el.className=cls;return el};
  const format=(s)=>{if(!Number.isFinite(s)||s<0)return '00:00';s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
  const skipIcon=(back)=>back?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.4 6.1"/><path d="M3 4v7h7"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11a9 9 0 1 0-2.4 6.1"/><path d="M21 4v7h-7"/></svg>';
  const playIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const pauseIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  function init(){
    const main=document.querySelector('main');
    const panel=document.querySelector('.audio-wrap,.audio-panel');
    if(!main||!panel||panel.classList.contains('kim-sticky-audio'))return;
    const audio=panel.querySelector('audio');if(!audio)return;
    // Detach the existing player once; keeping the audio node preserves source and playback state.
    const intro=main.querySelector('.opening,.hero,.card');
    if(intro)intro.insertAdjacentElement('afterend',panel);
    else main.insertBefore(panel,main.firstChild);
    panel.classList.add('kim-sticky-audio');
    audio.removeAttribute('controls');audio.preload='metadata';
    audio.setAttribute('aria-label','Full test audio');
    const header=make('div','kim-audio-heading'),title=panel.querySelector('h2,b,strong');
    if(title){title.classList.add('kim-audio-title');header.appendChild(title)}
    else {const t=make('strong','kim-audio-title');t.textContent='Listening Audio';header.appendChild(t)}
    
    panel.insertBefore(header,panel.firstChild);
    const controls=make('div','kim-cambridge-controls');
    function skipBtn(back){const b=make('button','kim-skip');b.type='button';b.title=back?'Rewind 10 seconds':'Forward 10 seconds';b.setAttribute('aria-label',b.title);b.innerHTML=skipIcon(back)+'<span>10s</span>';
      b.addEventListener('click',()=>{const delta=back?-10:10,d=audio.duration;try{audio.currentTime=Math.max(0,Math.min(Number.isFinite(d)?d:Infinity,audio.currentTime+delta))}catch(e){} });return b}
    const toggle=make('button','kim-toggle');toggle.type='button';toggle.title='Play audio';toggle.setAttribute('aria-label','Play audio');toggle.innerHTML=playIcon;
    controls.append(skipBtn(true),toggle,skipBtn(false));panel.appendChild(controls);
    const progress=make('div','kim-cambridge-progress');
    const current=make('span','kim-cambridge-time'),total=make('span','kim-cambridge-time');current.textContent='00:00';total.textContent='00:00';
    const seek=make('input');seek.type='range';seek.min='0';seek.max='1000';seek.step='1';seek.value='0';seek.setAttribute('aria-label','Seek audio timeline');
    progress.append(current,seek,total);panel.appendChild(progress);
    const footer=make('div','kim-cambridge-footer'),volwrap=make('label','kim-cambridge-volume');
    volwrap.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM17 9a5 5 0 0 1 0 6M19 6a9 9 0 0 1 0 12"/></svg>';
    const vol=make('input');vol.type='range';vol.min='0';vol.max='100';vol.step='1';vol.value=String(Math.round(audio.volume*100));vol.setAttribute('aria-label','Audio volume');volwrap.appendChild(vol);footer.appendChild(volwrap);panel.appendChild(footer);
    const err=make('div','kim-cambridge-error');err.setAttribute('role','status');panel.appendChild(err);
    function sync(){const duration=Number.isFinite(audio.duration)?audio.duration:0;current.textContent=format(audio.currentTime);total.textContent=format(duration);seek.value=duration?String(Math.round(audio.currentTime/duration*1000)):'0';seek.style.setProperty('--fill',((Number(seek.value)/10)||0)+'%');toggle.innerHTML=audio.paused?playIcon:pauseIcon;toggle.title=audio.paused?'Play audio':'Pause audio';toggle.setAttribute('aria-label',toggle.title)}
    toggle.addEventListener('click',()=>{if(audio.paused){const play=audio.play();if(play&&play.catch)play.catch(()=>{err.textContent='Audio could not play. Check the MP3 file.';sync()})}else audio.pause()});
    seek.addEventListener('input',()=>{const d=audio.duration;if(Number.isFinite(d)&&d>0){try{audio.currentTime=d*Number(seek.value)/1000}catch(e){}}sync()});
    vol.addEventListener('input',()=>{audio.volume=Number(vol.value)/100;vol.style.setProperty('--fill',vol.value+'%')});vol.style.setProperty('--fill',vol.value+'%');
    ['loadedmetadata','durationchange','timeupdate','play','pause','ended','seeked'].forEach(event=>audio.addEventListener(event,sync));
    audio.addEventListener('error',()=>{err.textContent='Audio could not load. Please check the MP3 file path.'});
    sync();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
